name: Android Build

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_REF: v1.14.0-alpha.45
  GO_VERSION: "1.25.11"
  NDK_VERSION: "28.2.13676358"

  # Gradle performance
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

  # Kotlin compiler performance
  KOTLIN_INCREMENTAL: "true"

jobs:
  # ============================================================
  # Build sing-box / libbox
  # ============================================================
  build-libbox:
    name: Build libbox
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Source
      # --------------------------------------------------------
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      # --------------------------------------------------------
      # Go
      # --------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      # --------------------------------------------------------
      # Java / Android
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      # --------------------------------------------------------
      # Cache libbox
      # --------------------------------------------------------
      - name: Cache libbox AARs
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: |
            sing-box/libbox.aar
            sing-box/libbox-legacy.aar
          key: >-
            libbox-${{ runner.os }}-${{ env.SING_BOX_REF }}-
            ${{ env.NDK_VERSION }}-
            ${{ hashFiles('sing-box/go.sum') }}
          restore-keys: |
            libbox-${{ runner.os }}-${{ env.SING_BOX_REF }}-${{ env.NDK_VERSION }}-

      # --------------------------------------------------------
      # Verify Android toolchain
      # --------------------------------------------------------
      - name: Verify Android toolchain
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          java -version
          go version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

      # --------------------------------------------------------
      # Build libbox AAR
      # --------------------------------------------------------
      - name: Build libbox AAR
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          make lib_install

          make lib_android \
            TAGS="with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor,with_grpc,with_dhcp,with_tailscale,with_embedded_tor"

      # --------------------------------------------------------
      # Locate libbox artifacts
      # --------------------------------------------------------
      - name: Locate libbox artifacts
        working-directory: sing-box
        run: |
          echo "=== libbox artifacts ==="

          find . -maxdepth 3 -type f \
            \( -iname "libbox*.aar" -o -iname "*.aar" \) \
            -print

      # --------------------------------------------------------
      # Verify libbox artifacts
      # --------------------------------------------------------
      - name: Verify libbox artifacts
        run: |
          test -f sing-box/libbox.aar
          test -f sing-box/libbox-legacy.aar

          echo "libbox.aar:"
          ls -lh sing-box/libbox.aar

          echo "libbox-legacy.aar:"
          ls -lh sing-box/libbox-legacy.aar

      # --------------------------------------------------------
      # Upload libbox artifacts
      # --------------------------------------------------------
      - name: Upload libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            sing-box/libbox.aar
            sing-box/libbox-legacy.aar
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # Build CipherTun-VPN
  # ============================================================
  build-app:
    name: Build CipherTun-VPN
    needs: build-libbox
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Source
      # --------------------------------------------------------
      - name: Checkout CipherTun-VPN
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Fetch third-party modules
      # --------------------------------------------------------
      - name: Fetch termux-app modules
        run: bash scripts/setup-third-party.sh

      # --------------------------------------------------------
      # Download libbox artifacts
      # --------------------------------------------------------
      - name: Download libbox artifacts
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      # --------------------------------------------------------
      # Verify downloaded libbox
      # --------------------------------------------------------
      - name: Verify downloaded libbox
        run: |
          echo "=== app/libs ==="
          ls -lh app/libs/

          test -f app/libs/libbox.aar
          test -f app/libs/libbox-legacy.aar

          echo "libbox AARs successfully downloaded."

      # --------------------------------------------------------
      # Java / Android
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      # --------------------------------------------------------
      # Cache Gradle wrapper and dependencies
      # --------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/daemon
            ~/.gradle/jdks
          key: >-
            ${{ runner.os }}-gradle-
            ${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-
            ${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-
            ${{ runner.os }}-gradle-

      # --------------------------------------------------------
      # Cache Android build outputs
      # --------------------------------------------------------
      - name: Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            app/build
            build
          key: >-
            ${{ runner.os }}-android-build-
            ${{ hashFiles('app/src/**/*.kt', 'app/src/**/*.java', 'app/build.gradle.kts', 'build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      # --------------------------------------------------------
      # Secrets
      # --------------------------------------------------------
      - name: Write local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "::error::LOCAL_PROPERTIES secret is empty."
            exit 1
          fi

          echo "$LOCAL_PROPERTIES" | base64 -d > local.properties

          test -s local.properties

      - name: Write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

          test -s app/release.keystore

      # --------------------------------------------------------
      # Verify build configuration
      # --------------------------------------------------------
      - name: Verify Android build configuration
        run: |
          echo "=== Gradle ==="
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties

          echo "=== AGP ==="
          grep "com.android.application" build.gradle.kts

          echo "=== App namespace ==="
          grep -n "namespace" app/build.gradle.kts

          echo "=== App NDK ==="
          grep -n "ndkVersion" app/build.gradle.kts || true

          echo "=== Project NDK ==="
          grep -n "ndkVersion" gradle.properties || true

          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Android NDK ==="
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          test -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle configuration
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew help \
            --stacktrace \
            --warning-mode all \
            --build-cache

      # --------------------------------------------------------
      # Debug APKs
      # --------------------------------------------------------
      - name: Build debug APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew \
            :app:assemblePlayDebug \
            :app:assembleOtherDebug \
            :app:assembleOtherLegacyDebug \
            --build-cache \
            --parallel \
            --stacktrace

      # --------------------------------------------------------
      # Release APKs
      # --------------------------------------------------------
      - name: Build release APKs
        if: github.event_name == 'push'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew \
            :app:assemblePlayRelease \
            :app:assembleOtherRelease \
            :app:assembleOtherLegacyRelease \
            --build-cache \
            --parallel \
            --stacktrace

      # --------------------------------------------------------
      # Artifacts
      # --------------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ciphertun-vpn-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0