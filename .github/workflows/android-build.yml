name: Build CipherTun VPN

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "sing-box ref (default: v1.15.0-alpha.6)"
        required: false
        default: "v1.15.0-alpha.6"

env:
  SING_BOX_REF: ${{ inputs.sing_box_ref || 'v1.15.0-alpha.6' }}
  GO_VERSION: "1.26.8"
  NDK_VERSION: "28.2.13676358"

jobs:
  build-libbox:
    name: libbox ${{ matrix.go_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_arch: [386, amd64, arm, arm64]

    steps:
      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android toolchain
        run: |
          set -eux
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/ndk-build" --version | head -n 2

      - name: Build libbox AARs
        working-directory: sing-box
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          make lib_install
          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/${{ matrix.go_arch }}
          test -s libbox.aar
          test -s libbox-legacy.aar
          mkdir -p ../libbox-out
          cp libbox.aar ../libbox-out/libbox.aar
          cp libbox-legacy.aar ../libbox-out/libbox-legacy.aar

      - name: Upload arch AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-${{ matrix.go_arch }}
          path: libbox-out/*.aar
          retention-days: 7

  merge-libbox:
    name: Merge libbox AARs
    needs: build-libbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Download arch AARs
        uses: actions/download-artifact@v7
        with:
          pattern: libbox-*
          path: sing-box/libbox-inputs
          merge-multiple: false

      - name: Verify downloaded AARs
        run: |
          set -eux
          test "$(find sing-box/libbox-inputs -type f -name 'libbox.aar' | wc -l)" -eq 4
          test "$(find sing-box/libbox-inputs -type f -name 'libbox-legacy.aar' | wc -l)" -eq 4

      - name: Merge all ABIs
        working-directory: sing-box
        run: |
          set -euxo pipefail
          go run ./cmd/internal/merge_aar \
            -output libbox.aar \
            libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar \
            -output libbox-legacy.aar \
            libbox-inputs/*/libbox-legacy.aar
          test -s libbox.aar
          test -s libbox-legacy.aar
          mkdir -p ../merged-aar
          cp libbox.aar ../merged-aar/libbox.aar
          cp libbox-legacy.aar ../merged-aar/libbox-legacy.aar

      - name: Upload merged AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-aars
          path: merged-aar/*.aar
          retention-days: 7


  build-apk:
    name: APK ${{ matrix.abi }}
    needs: merge-libbox
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout CipherTun VPN
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK before compilation
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "$SDK"
          test -d "$SDK/platforms/android-37.1"
          test -d "$SDK/build-tools/37.0.0"
          test -d "$SDK/ndk/${NDK_VERSION}"

      - name: Download merged libbox AARs
        uses: actions/download-artifact@v7
        with:
          name: libbox-aars
          path: app/libs

      - name: Verify libbox before Gradle
        run: |
          set -eux
          test -s app/libs/libbox.aar
          test -s app/libs/libbox-legacy.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Fast Gradle configuration check
        run: ./gradlew :app:help --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eux
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            test -s app/release.keystore
          fi

      - name: Configure ABI
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -eux
          cp app/build.gradle.kts app/build.gradle.kts.bak
          sed -i '/^[[:space:]]*splits[[:space:]]*{$/,/^[[:space:]]*}[[:space:]]*$/d' app/build.gradle.kts
          sed -i "/^[[:space:]]*compileOptions[[:space:]]*{/i\\
    splits {\\
        abi {\\
            isEnable = true\\
            isUniversalApk = false\\
            reset()\\
            include(\"${TARGET_ABI}\")\\
        }\\
    }\\
" app/build.gradle.kts
          grep -n -A10 -B2 "splits" app/build.gradle.kts

      - name: Build ABI APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -eux
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          ./gradlew \
            :app:assembleOtherRelease \
            :app:assembleOtherLegacyRelease \
            --parallel \
            --no-build-cache \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -eux
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore

      - name: Upload ABI APK
        uses: actions/upload-artifact@v6
        with:
          name: CipherTun-VPN-v1.15.0-alpha.6-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
