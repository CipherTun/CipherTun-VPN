name: Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_REF: v1.14.0-alpha.45
  GO_VERSION: "1.25.11"
  NDK_VERSION: "28.2.13676358"

  # Gradle performance
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ============================================================
  # Build sing-box / libbox
  # ============================================================
  build-libbox:
    name: Build libbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Verify Android toolchain
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          java -version
          go version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

      - name: Build libbox AAR
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          make lib_install
          make lib_android TAGS="with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor,with_grpc,with_dhcp,with_tailscale,with_embedded_tor"

      - name: Locate libbox artifacts
        working-directory: sing-box
        run: |
          find . -maxdepth 3 -type f \
            \( -iname "libbox*.aar" -o -iname "*.aar" \) \
            -print

      - name: Verify libbox artifacts
        run: |
          test -f sing-box/libbox.aar
          test -f sing-box/libbox-legacy.aar

      - name: Upload libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            sing-box/libbox.aar
            sing-box/libbox-legacy.aar
          if-no-files-found: error

  # ============================================================
  # Build CipherTun-VPN
  # ============================================================
  build-app:
    name: Build CipherTun-VPN
    needs: build-libbox
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Source
      # --------------------------------------------------------
      - name: Checkout CipherTun-VPN
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Fetch third-party modules
      # --------------------------------------------------------
      - name: Fetch termux-app modules
        run: bash scripts/setup-third-party.sh

      - name: Download libbox artifacts
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      # --------------------------------------------------------
      # Java / Android
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      # --------------------------------------------------------
      # Secrets
      # --------------------------------------------------------
      - name: Write local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "::error::LOCAL_PROPERTIES secret is empty."
            exit 1
          fi

          echo "$LOCAL_PROPERTIES" | base64 -d > local.properties
          test -s local.properties

      - name: Write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          test -s app/release.keystore

      # --------------------------------------------------------
      # Verify build configuration
      # --------------------------------------------------------
      - name: Verify Android build configuration
        run: |
          echo "=== Gradle ==="
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties

          echo "=== AGP ==="
          grep "com.android.application" build.gradle.kts

          echo "=== App namespace ==="
          grep -n "namespace" app/build.gradle.kts

          echo "=== App NDK ==="
          grep -n "ndkVersion" app/build.gradle.kts

          echo "=== Project NDK ==="
          grep -n "ndkVersion" gradle.properties

          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Android NDK ==="
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          test -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle configuration
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew help \
            --stacktrace \
            --warning-mode all \
            --build-cache

      # --------------------------------------------------------
      # Debug APKs
      # --------------------------------------------------------
      - name: Build debug APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            :app:assemblePlayDebug \
            :app:assembleOtherDebug \
            :app:assembleOtherLegacyDebug

      # --------------------------------------------------------
      # Release APKs
      # --------------------------------------------------------
      - name: Build release APKs
        if: github.event_name == 'push'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew \
            --parallel \
            --build-cache \
            :app:assemblePlayRelease \
            :app:assembleOtherRelease \
            :app:assembleOtherLegacyRelease

      # --------------------------------------------------------
      # Artifacts
      # --------------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ciphertun-vpn-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error