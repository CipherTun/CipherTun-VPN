# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.
# For more details on configuring your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# org.gradle.parallel=true

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true

# Properties used by third_party/termux-app modules.
compileSdkVersion=36
minSdkVersion=21
targetSdkVersion=35
ndkVersion=28.0.13004108