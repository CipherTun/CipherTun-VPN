name: Build CipherTun VPN

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "sing-box ref (default: v1.15.0-alpha.6)"
        required: false
        default: "v1.15.0-alpha.6"

env:
  SING_BOX_REF: ${{ inputs.sing_box_ref || 'v1.15.0-alpha.6' }}
  GO_VERSION: "1.26.8"
  NDK_VERSION: "28.2.13676358"

jobs:
  build-libbox:
    name: libbox ${{ matrix.go_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_arch: [386, amd64, arm, arm64]
    steps:
      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Build libbox AARs
        working-directory: sing-box
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          test -f libbox.aar
          test -f libbox-legacy.aar
          mkdir -p ../libbox-out
          cp libbox.aar ../libbox-out/libbox.aar
          cp libbox-legacy.aar ../libbox-out/libbox-legacy.aar

      - name: Upload arch AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-${{ matrix.go_arch }}
          path: libbox-out/*.aar
          retention-days: 7

  merge-libbox:
    needs: build-libbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum

      - name: Download arch AARs
        uses: actions/download-artifact@v7
        with:
          pattern: libbox-*
          path: sing-box/libbox-inputs
          merge-multiple: false

      - name: Merge all ABIs
        working-directory: sing-box
        run: |
          set -euxo pipefail
          go run ./cmd/internal/merge_aar -output libbox.aar libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output libbox-legacy.aar libbox-inputs/*/libbox-legacy.aar
          mkdir -p ../merged-aar
          cp libbox.aar libbox-legacy.aar ../merged-aar/

      - name: Upload merged AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-aars
          path: merged-aar/*.aar
          retention-days: 7

  build-apk:
    needs: merge-libbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CipherTun VPN
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          sdkmanager "platforms;android-37" "platform-tools" "ndk;${{ env.NDK_VERSION }}"

      - name: Download merged libbox AARs
        uses: actions/download-artifact@v7
        with:
          name: libbox-aars
          path: app/libs

      - name: Verify libbox
        run: |
          set -eux
          test -f app/libs/libbox.aar
          test -f app/libs/libbox-legacy.aar

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build all Android ABIs + universal APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          ./gradlew :app:assembleOtherRelease :app:assembleOtherLegacyRelease --stacktrace

      - name: Verify APK outputs
        run: |
          set -eux
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 2
          echo "=== ABI APKs ==="
          find app/build/outputs/apk -type f -name '*.apk' -printf '%f\n' | sort
          echo "=== Version ==="
          cat version.properties

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: CipherTun-VPN-v1.15.0-alpha.6
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
