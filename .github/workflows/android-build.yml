name: Build CipherTun VPN

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "sing-box ref"
        required: false
        default: "v1.15.0-alpha.10"

env:
  SING_BOX_REF: ${{ inputs.sing_box_ref || 'v1.15.0-alpha.10' }}
  SING_BOX_COMMIT: "c992297988288565a24a6d36e2cf4d77cb835fcd"
  GO_VERSION: "1.26.8"
  NDK_VERSION: "28.2.13676358"
  GRADLE_VERSION: "9.6.0"

permissions:
  contents: read

jobs:

  build-libbox:
    name: libbox ${{ matrix.go_arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go_arch: [386, amd64, arm, arm64]

    steps:

      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Verify exact sing-box source
        working-directory: sing-box
        run: |
          set -euxo pipefail

          ACTUAL_VERSION="$(git describe --tags --exact-match HEAD)"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Version: $ACTUAL_VERSION"
          echo "Commit:  $ACTUAL_COMMIT"

          test "$ACTUAL_VERSION" = "v1.15.0-alpha.10"
          test "$ACTUAL_COMMIT" = "$SING_BOX_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager"             "ndk;${NDK_VERSION}"

          test -d "$SDK/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Verify build toolchain
        run: |
          set -euxo pipefail

          java -version
          go version

          NDK_PATH="$ANDROID_NDK_HOME"
          test -d "$NDK_PATH"

          echo "NDK_PATH=$NDK_PATH"
          "$NDK_PATH/ndk-build" --version | head -n 2

      - name: Build libbox AARs
        working-directory: sing-box
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"

          make lib_install

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/${{ matrix.go_arch }}

          test -s libbox.aar
          test -s libbox-legacy.aar

          mkdir -p ../libbox-out

          cp libbox.aar ../libbox-out/libbox.aar
          cp libbox-legacy.aar ../libbox-out/libbox-legacy.aar

      - name: Upload architecture AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-${{ matrix.go_arch }}
          path: libbox-out/*.aar
          retention-days: 7

  merge-libbox:
    name: Merge libbox AARs
    needs: build-libbox
    runs-on: ubuntu-latest

    steps:

      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Verify exact sing-box source
        working-directory: sing-box
        run: |
          set -euxo pipefail

          test "$(git describe --tags --exact-match HEAD)" = "v1.15.0-alpha.10"
          test "$(git rev-parse HEAD)" = "$SING_BOX_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Download architecture AARs
        uses: actions/download-artifact@v7
        with:
          pattern: libbox-*
          path: sing-box/libbox-inputs
          merge-multiple: false

      - name: Verify architecture AARs
        run: |
          set -eux

          MAIN_COUNT="$(find sing-box/libbox-inputs -type f -name 'libbox.aar' | wc -l)"
          LEGACY_COUNT="$(find sing-box/libbox-inputs -type f -name 'libbox-legacy.aar' | wc -l)"

          echo "Main AARs:   $MAIN_COUNT"
          echo "Legacy AARs: $LEGACY_COUNT"

          test "$MAIN_COUNT" -eq 4
          test "$LEGACY_COUNT" -eq 4

      - name: Merge all ABIs
        working-directory: sing-box
        run: |
          set -euxo pipefail

          go run ./cmd/internal/merge_aar \
            -output libbox.aar \
            libbox-inputs/*/libbox.aar

          go run ./cmd/internal/merge_aar \
            -output libbox-legacy.aar \
            libbox-inputs/*/libbox-legacy.aar

          test -s libbox.aar
          test -s libbox-legacy.aar

          mkdir -p ../merged-aar

          cp libbox.aar ../merged-aar/libbox.aar
          cp libbox-legacy.aar ../merged-aar/libbox-legacy.aar

      - name: Upload merged libbox AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-aars
          path: merged-aar/*.aar
          retention-days: 7

  build-apk:
    name: APK ${{ matrix.abi }}
    needs: merge-libbox
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:

      - name: Checkout CipherTun VPN
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager"             "ndk;${NDK_VERSION}"

          test -d "$SDK/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Verify Android toolchain
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          test -d "$SDK"
          test -d "$SDK/platforms/android-37"
          test -d "$SDK/build-tools/36.0.0"

          NDK_PATH="$ANDROID_NDK_HOME"
          test -d "$NDK_PATH"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK_PATH"

      - name: Download merged libbox AARs
        uses: actions/download-artifact@v7
        with:
          name: libbox-aars
          path: app/libs

      - name: Verify merged libbox
        run: |
          set -eux

          test -s app/libs/libbox.aar
          test -s app/libs/libbox-legacy.aar

          ls -lh app/libs/libbox*.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: false

      - name: Verify Gradle
        run: |
          set -eux
          gradle --version

      - name: Verify CipherTun version
        id: version
        run: |
          set -eux

          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          GO_VERSION="$(grep '^GO_VERSION=' version.properties | cut -d= -f2)"

          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"
          echo "GO_VERSION=$GO_VERSION"

          test "$VERSION_CODE" = "742"
          test "$VERSION_NAME" = "1.15.0-alpha.10"
          test "$GO_VERSION" = "go1.26.8"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Fast Gradle configuration check
        run: |
          set -eux
          gradle :app:help --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eux

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            test -s app/release.keystore
          fi

      - name: Build ABI APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"

          gradle \
            :app:assembleOtherRelease \
            :app:assembleOtherLegacyRelease \
            -PtargetAbi="$TARGET_ABI" \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -eux

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore

      - name: Upload ABI APK
        uses: actions/upload-artifact@v6
        with:
          name: CipherTun-VPN-${{ steps.version.outputs.version }}-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
