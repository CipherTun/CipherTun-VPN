name: Build CipherTun VPN

# Builds on every branch push. The sing-box core version is read from
# version.properties on the branch being built, so each branch is
# self-describing and can pin its own core:
#   SING_BOX_REF     optional, defaults to v<VERSION_NAME>
#   SING_BOX_COMMIT  optional, if set the checked-out core must match it
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "Override sing-box ref (default: version.properties, else v<VERSION_NAME>)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  GRADLE_VERSION: "9.6.0"

jobs:

  meta:
    name: Read version metadata
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.read.outputs.version_name }}
      version_code: ${{ steps.read.outputs.version_code }}
      go_version: ${{ steps.read.outputs.go_version }}
      sing_box_ref: ${{ steps.read.outputs.sing_box_ref }}
      sing_box_commit: ${{ steps.read.outputs.sing_box_commit }}

    steps:

      - name: Checkout CipherTun VPN
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read version.properties
        id: read
        env:
          INPUT_SING_BOX_REF: ${{ inputs.sing_box_ref }}
        run: |
          set -euo pipefail

          prop() {
            grep -E "^$1=" version.properties | head -n1 | cut -d= -f2- | tr -d '\r' || true
          }

          VERSION_NAME="$(prop VERSION_NAME)"
          VERSION_CODE="$(prop VERSION_CODE)"
          GO_RAW="$(prop GO_VERSION)"
          SB_REF="$(prop SING_BOX_REF)"
          SB_COMMIT="$(prop SING_BOX_COMMIT)"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          GO_VERSION="${GO_RAW#go}"
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="1.26.8"
          fi

          if [ -n "$INPUT_SING_BOX_REF" ]; then
            SB_REF="$INPUT_SING_BOX_REF"
            SB_COMMIT=""
          fi
          if [ -z "$SB_REF" ]; then
            SB_REF="v${VERSION_NAME}"
          fi

          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "GO_VERSION=$GO_VERSION"
          echo "SING_BOX_REF=$SB_REF"
          echo "SING_BOX_COMMIT=${SB_COMMIT:-<not pinned>}"

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "go_version=$GO_VERSION"
            echo "sing_box_ref=$SB_REF"
            echo "sing_box_commit=$SB_COMMIT"
          } >> "$GITHUB_OUTPUT"

  build-libbox:
    name: libbox ${{ matrix.go_arch }}
    needs: meta
    runs-on: ubuntu-latest

    env:
      SING_BOX_REF: ${{ needs.meta.outputs.sing_box_ref }}
      SING_BOX_COMMIT: ${{ needs.meta.outputs.sing_box_commit }}
      GO_VERSION: ${{ needs.meta.outputs.go_version }}

    strategy:
      fail-fast: false
      matrix:
        go_arch: [386, amd64, arm, arm64]

    steps:

      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Verify sing-box source
        working-directory: sing-box
        run: |
          set -euxo pipefail

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"

          echo "Ref:     $SING_BOX_REF"
          echo "Version: ${ACTUAL_VERSION:-<not a tag>}"
          echo "Commit:  $ACTUAL_COMMIT"

          if [ -n "$ACTUAL_VERSION" ]; then
            test "$ACTUAL_VERSION" = "$SING_BOX_REF"
          fi
          if [ -n "$SING_BOX_COMMIT" ]; then
            test "$ACTUAL_COMMIT" = "$SING_BOX_COMMIT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --channel=1 "ndk;${NDK_VERSION}"

          test -d "$SDK/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Verify build toolchain
        run: |
          set -euxo pipefail

          java -version
          go version

          test -d "$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/ndk-build" --version | head -n 2

      - name: Build libbox AARs
        working-directory: sing-box
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"

          make lib_install

          go run ./cmd/internal/build_libbox \
            -target android \
            -platform android/${{ matrix.go_arch }}

          test -s libbox.aar
          test -s libbox-legacy.aar

          mkdir -p ../libbox-out

          cp libbox.aar ../libbox-out/libbox.aar
          cp libbox-legacy.aar ../libbox-out/libbox-legacy.aar

      - name: Upload architecture AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-${{ matrix.go_arch }}
          path: libbox-out/*.aar
          retention-days: 7

  merge-libbox:
    name: Merge libbox AARs
    needs: [meta, build-libbox]
    runs-on: ubuntu-latest

    env:
      SING_BOX_REF: ${{ needs.meta.outputs.sing_box_ref }}
      GO_VERSION: ${{ needs.meta.outputs.go_version }}

    steps:

      - name: Checkout sing-box core
        uses: actions/checkout@v6
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Download architecture AARs
        uses: actions/download-artifact@v7
        with:
          pattern: libbox-*
          path: sing-box/libbox-inputs
          merge-multiple: false

      - name: Verify architecture AARs
        run: |
          set -eux

          MAIN_COUNT="$(find sing-box/libbox-inputs -type f -name 'libbox.aar' | wc -l)"
          LEGACY_COUNT="$(find sing-box/libbox-inputs -type f -name 'libbox-legacy.aar' | wc -l)"

          echo "Main AARs:   $MAIN_COUNT"
          echo "Legacy AARs: $LEGACY_COUNT"

          test "$MAIN_COUNT" -eq 4
          test "$LEGACY_COUNT" -eq 4

      - name: Merge all ABIs
        working-directory: sing-box
        run: |
          set -euxo pipefail

          go run ./cmd/internal/merge_aar \
            -output libbox.aar \
            libbox-inputs/*/libbox.aar

          go run ./cmd/internal/merge_aar \
            -output libbox-legacy.aar \
            libbox-inputs/*/libbox-legacy.aar

          test -s libbox.aar
          test -s libbox-legacy.aar

          mkdir -p ../merged-aar

          cp libbox.aar ../merged-aar/libbox.aar
          cp libbox-legacy.aar ../merged-aar/libbox-legacy.aar

      - name: Upload merged libbox AARs
        uses: actions/upload-artifact@v6
        with:
          name: libbox-aars
          path: merged-aar/*.aar
          retention-days: 7

  build-apk:
    name: APK ${{ matrix.abi }}
    needs: [meta, merge-libbox]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:

      - name: Checkout CipherTun VPN
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --channel=1 "ndk;${NDK_VERSION}"

          test -d "$SDK/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0"

      - name: Verify Android toolchain
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          test -d "$SDK"
          test -d "$SDK/platforms/android-37.1"
          test -d "$SDK/build-tools/37.0.0"
          test -d "$ANDROID_NDK_HOME"

          echo "Android SDK: $SDK"
          echo "Android NDK: $ANDROID_NDK_HOME"

      - name: Download merged libbox AARs
        uses: actions/download-artifact@v7
        with:
          name: libbox-aars
          path: app/libs

      - name: Verify merged libbox
        run: |
          set -eux

          test -s app/libs/libbox.aar
          test -s app/libs/libbox-legacy.aar

          ls -lh app/libs/libbox*.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: Verify Gradle
        run: |
          set -eux
          gradle --version

      - name: Show CipherTun version
        run: |
          echo "VERSION_NAME=${{ needs.meta.outputs.version_name }}"
          echo "VERSION_CODE=${{ needs.meta.outputs.version_code }}"
          echo "sing-box=${{ needs.meta.outputs.sing_box_ref }}"

      - name: Fast Gradle configuration check
        run: |
          set -eux
          gradle :app:help --no-daemon --stacktrace

      - name: Prepare signing and choose variants
        id: variants
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            test -s app/release.keystore
            echo "tasks=:app:assembleOtherRelease :app:assembleOtherLegacyRelease" >> "$GITHUB_OUTPUT"
          else
            echo "No signing keystore secret, building debug variants"
            echo "tasks=:app:assembleOtherDebug :app:assembleOtherLegacyDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ABI APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"

          gradle \
            ${{ steps.variants.outputs.tasks }} \
            -PtargetAbi="$TARGET_ABI" \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -eux

          find app/build/outputs/apk -type f -name '*.apk' -print

          test -n "$(
            find app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore

      - name: Upload ABI APK
        uses: actions/upload-artifact@v6
        with:
          name: CipherTun-VPN-${{ needs.meta.outputs.version_name }}-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
